name: ROOK future SRS+ budget full KO ablation
on:
  push:
    branches: [feat/rook-independent-bot]
    paths:
      - scripts/rook-vs-rook.js
      - src/analysis/rook.js
      - .github/workflows/rook-future-srs-ablation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-ko:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [1, 8, 16, 23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full KO with exactly matched seeds and search eval budgets
        env:
          SEEDS: ${{ matrix.seed }}
          MAX_LOCKS: '2000'
          ROOK_NODES: '6000'
          EXPERT_OPEN: '0'
          EXPERT_RECOVERY: '0'
          EXPERT_BELIEF: '0'
          EXPERT_FUTURE: '1'
          EXPERT_FUTURE_PROBES: '24'
          EXPERT_FUTURE_STATES: '800'
        run: |
          set -eu
          node scripts/rook-vs-rook.js > "rook-future-srs-${{ matrix.seed }}.jsonl"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const rows=readFileSync('rook-future-srs-${{ matrix.seed }}.jsonl','utf8')
            .trim().split('\n').map(JSON.parse);
          if(rows.length!==2||rows[0].swap!==false||rows[1].swap!==true||
            rows.some(r=>r.error||r.seed!==Number('${{ matrix.seed }}')||
              !r.sameSeed||!r.simultaneousLocks||r.seeds[0]!==r.seeds[1]||
              r.nodeBudget!==6000||r.cap!==2000||!r.expertFuture||
              r.expertOpen||r.expertRecovery||r.expertBelief||
              r.expertLabel!=='future-srs'||
              r.scored!==(r.termination==='KO')||
              r.slots.some(s=>s.pieces!==r.turns||
                !Number.isFinite(s.forwardProbes)||!Number.isFinite(s.ms))))
            throw Error('Invalid full KO future SRS+ paired experiment');
          const sample=rows[0].slots;
          const expert=sample.find(s=>s.kind==='future-srs');
          const base=sample.find(s=>s.kind==='baseline');
          if(!expert||!base||expert.forwardProbes<=base.forwardProbes)
            throw Error('Future SRS+ experiment did not actually increase BFS proofs');
          console.log(JSON.stringify(rows.map(r=>({
            seed:r.seed,swap:r.swap,turns:r.turns,termination:r.termination,winner:r.winner,
            slots:r.slots.map(s=>({kind:s.kind,ms:s.ms,sentAPP:s.sentAPP,
              forwardProbes:s.forwardProbes,forwardMoves:s.forwardMoves}))}))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rook-future-srs-ko-${{ matrix.seed }}
          path: rook-future-srs-${{ matrix.seed }}.jsonl
          retention-days: 30
  report:
    needs: paired-ko
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rook-future-srs-ko-*
          merge-multiple: true
      - name: Report KO independently of capped games and additional CPU
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const seeds=[1,8,16,23],rows=seeds.flatMap(seed=>
            readFileSync('rook-future-srs-'+seed+'.jsonl','utf8')
              .trim().split('\n').map(JSON.parse));
          if(rows.length!==seeds.length*2||rows.some(r=>r.error))throw Error('Bad KO experiment');
          const scored=rows.filter(r=>r.scored);
          const accum=(kind,key)=>rows.reduce((v,r)=>
            v+(r.slots.find(s=>s.kind===kind)?.[key]??0),0);
          const result={protocol:'rook-full-srs-plus-forecast-ablation-v1',
            games:rows.length,distinctSeeds:seeds.length,cap:2000,
            scoredKO:scored.length,capped:rows.filter(r=>r.termination==='capped').length,
            doubleKO:rows.filter(r=>r.termination==='double-KO').length,
            futureWins:scored.filter(r=>r.winner==='future-srs').length,
            baselineWins:scored.filter(r=>r.winner==='baseline').length,
            futureTotalMs:accum('future-srs','ms'),
            baselineTotalMs:accum('baseline','ms'),
            futureTotalProbes:accum('future-srs','forwardProbes'),
            baselineTotalProbes:accum('baseline','forwardProbes'),
            note:'Same 6000 placement evaluations; BFS probe CPU is additional and explicitly measured.',
            matches:rows};
          writeFileSync('rook-future-srs-ko-summary.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({...result,matches:undefined}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rook-future-srs-ko-summary
          path: rook-future-srs-ko-summary.json
          retention-days: 30
