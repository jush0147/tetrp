name: Kiwi tail value offline preflight
on:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-tail-value-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-tail-value-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-wasm-source
      - name: Restore accepted source and install isolated experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test test/kiwi-tail-value.test.js
          gh run download 36387270053 --repo jush0147/tetrp -n cc2-landing-36387270053-1 -D .cache/eval-artifact
          gh run download 36849221714 --repo jush0147/tetrp -n kiwi-native-runtime-36849221714 -D .cache/native-artifact
          chmod +x .cache/native-artifact/snapshot-accepted
          git -C .cache/cc2-wasm-source apply "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          node scripts/kiwi-tail-value-prepare.js install
          git -C .cache/cc2-wasm-source diff > .cache/tail-value-build/source.patch
      - name: Rust semantic tests and two binaries
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          for mode in control candidate; do
            flags=""
            if [ "$mode" = candidate ]; then flags="--cfg tail_value_candidate"; fi
            RUSTFLAGS="$flags" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib snapshot::tests
            RUSTFLAGS="$flags" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib tail_value_tests
            RUSTFLAGS="$flags" cargo +1.90.0 build --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --bin snapshot_tail
            cp .cache/cc2-wasm-source/target/release/snapshot_tail .cache/tail-value-build/snapshot-$mode
          done
      - name: Twenty public snapshots, budget accounting and authority root parity
        run: node scripts/kiwi-tail-value-audit.js audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-tail-value-preflight
          path: .cache/tail-value-build/
          include-hidden-files: true
          retention-days: 30
      - name: Notify result without launching arena
        if: always()
        env:
          AUDIT_STATUS: ${{ job.status }}
        run: node scripts/kiwi-tail-value-audit.js notify
