name: Kiwi residual value offline preflight
on:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-residual-value.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-residual-value-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-wasm-source
      - name: Restore source and isolate candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test test/kiwi-residual-value.test.js
          gh run download 36387270053 --repo jush0147/tetrp -n cc2-landing-36387270053-1 -D .cache/eval-artifact
          gh run download 36849221714 --repo jush0147/tetrp -n kiwi-native-runtime-36849221714 -D .cache/native-artifact
          chmod +x .cache/native-artifact/snapshot-accepted
          git -C .cache/cc2-wasm-source apply "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          node scripts/kiwi-residual-value-audit.js prepare
          node scripts/kiwi-native-runner-prepare.js
          node scripts/kiwi-residual-value-prepare.js
          git -C .cache/cc2-wasm-source diff > .cache/residual-value-results/candidate.patch
          rustup toolchain install 1.90.0 --profile minimal
      - name: Compile default-off and candidate semantic tests
        run: |
          cargo +1.90.0 build --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --bin snapshot_stdio
          cp .cache/cc2-wasm-source/target/release/snapshot_stdio .cache/residual-value-results/snapshot-off
          RUSTFLAGS="--cfg residual_value" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib residual_
          RUSTFLAGS="--cfg residual_value" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib snapshot::tests
          RUSTFLAGS="--cfg residual_value" cargo +1.90.0 build --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --bin snapshot_stdio
          cp .cache/cc2-wasm-source/target/release/snapshot_stdio .cache/residual-value-results/snapshot-on
      - name: Capture bounded real leaf witnesses outside timing
        run: |
          RUSTFLAGS="--cfg residual_value --cfg residual_trace" RESIDUAL_INPUT="$GITHUB_WORKSPACE/.cache/residual-value-results/inputs.json" RESIDUAL_OUTPUT="$GITHUB_WORKSPACE/.cache/residual-value-results/trace.json" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib residual_trace_real_inputs -- --test-threads=1
      - name: Authority parity and paired cost gate
        run: node scripts/kiwi-residual-value-audit.js audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-residual-value
          path: .cache/residual-value-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify once, no arena
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/kiwi-residual-value-audit.js notify
