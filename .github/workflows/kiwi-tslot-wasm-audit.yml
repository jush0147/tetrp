name: Kiwi visible-T WASM and Worker validation
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-tslot-wasm-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-tslot-wasm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-wasm-source
      - name: Restore exact accepted source and verified native results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36387270053 --repo jush0147/tetrp --name cc2-landing-36387270053-1 --dir .cache/eval-artifact
          gh run download 36566413689 --repo jush0147/tetrp --name kiwi-tslot-resource-audit-36566413689 --dir .cache/tslot-native-reference
          git -C .cache/cc2-wasm-source apply --check "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          git -C .cache/cc2-wasm-source apply "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          node scripts/kiwi-tslot-candidate-prepare.js install
          mkdir -p .cache/tslot-wasm-results
          git -C .cache/cc2-wasm-source diff > .cache/tslot-wasm-results/candidate.patch
      - name: Build isolated single-threaded candidate without observers
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.90.0 install wasm-bindgen-cli --version "$(cat .cache/eval-artifact/cc2-wasm-results/bindgen-version.txt)" --locked
          RUSTFLAGS="--cfg snapshot_visible_t" cargo +1.90.0 build --locked --release --target wasm32-unknown-unknown --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib
          wasm-bindgen .cache/cc2-wasm-source/target/wasm32-unknown-unknown/release/cold_clear_2.wasm --target web --out-dir .cache/tslot-wasm-results/pkg
          rustc +1.90.0 --version > .cache/tslot-wasm-results/rust-version.txt
      - name: Exact report parity, authority top-1 and paired browser latency
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/kiwi-tslot-wasm-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-tslot-wasm-${{ github.run_id }}
          path: .cache/tslot-wasm-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify once
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/kiwi-tslot-wasm-browser.js notify
