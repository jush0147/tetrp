name: ROOK source snapshot for offline profiling
on:
  push:
    branches: [feat/rook-independent-bot]
    paths:
      - 'src/analysis/rook.js'
      - 'src/analysis/rook-reverse-planner.js'
      - 'src/analysis/rook-long-planner.js'
      - 'docs/ROOK_REVERSE_ATTACK_PLANNER.md'
      - 'src/analysis/rook-tsd.js'
      - 'scripts/rook-strength-screen.js'
      - '.github/workflows/rook-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact source revision for reproducible local profiling
        run: git archive --format=zip --output=rook-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rook-exact-source
          path: rook-source.zip
          retention-days: 7
