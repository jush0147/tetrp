name: ROOK source snapshot for offline profiling
on:
  push:
    branches: [feat/rook-independent-bot]
    paths:
      - .github/workflows/rook-source-snapshot.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact source revision for reproducible local profiling
        run: git archive --format=zip --output=rook-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rook-exact-source
          path: rook-source.zip
          retention-days: 7
      - name: Record source run ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 8 --repo jush0147/tetrp --body "ROOK lightweight local test source snapshot: https://github.com/jush0147/tetrp/actions/runs/$GITHUB_RUN_ID (commit $GITHUB_SHA). This archives committed source only; no benchmark or KO was run."
# P0 offline source baseline: 2026-10-10 offensive construction research.
