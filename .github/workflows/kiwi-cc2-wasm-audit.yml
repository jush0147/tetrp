name: CC2 corrected WASM browser audit
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-cc2-wasm-audit.yml]
permissions:
  contents: read
concurrency:
  group: cc2-wasm-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-wasm-source
      - name: Prepare uninstrumented candidate and public inputs
        run: |
          node scripts/kiwi-cc2-wasm-prepare.js
          node scripts/kiwi-cc2-transition-audit.js prepare .cache/cc2-transition-results
          node scripts/kiwi-cc2-trace.js prepare
      - name: Build single-threaded WASM
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.90.0 install wasm-bindgen-cli --version "$(cat .cache/cc2-wasm-results/bindgen-version.txt)" --locked
          cargo +1.90.0 build --locked --release --target wasm32-unknown-unknown --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib
          wasm-bindgen .cache/cc2-wasm-source/target/wasm32-unknown-unknown/release/cold_clear_2.wasm --target web --out-dir .cache/cc2-wasm-results/pkg
          sha256sum .cache/cc2-wasm-results/pkg/* > .cache/cc2-wasm-results/pkg-sha256.txt
      - name: Run actual Chromium Worker
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/kiwi-cc2-wasm-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc2-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/cc2-wasm-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify completion or failure
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/kiwi-cc2-wasm-notify.js
