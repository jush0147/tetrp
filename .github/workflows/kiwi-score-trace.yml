name: Kiwi offline final score trace
on:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-score-trace.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-score-trace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-wasm-source
      - name: Restore accepted source and baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test test/kiwi-score-trace.test.js
          gh run download 36387270053 --repo jush0147/tetrp -n cc2-landing-36387270053-1 -D .cache/eval-artifact
          git -C .cache/cc2-wasm-source apply "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          node scripts/kiwi-eval-audit.js baseline .cache/eval-artifact/cc2-wasm-results/pkg
          node scripts/kiwi-eval-observer-prepare.js runner
      - name: Accepted observer-off reports
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          EVAL_AUDIT_INPUT="$GITHUB_WORKSPACE/docs/audits/cc2-alignment/eval-public-inputs.json" EVAL_AUDIT_OUTPUT="$GITHUB_WORKSPACE/.cache/cc2-eval-results/native-reference.json" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib eval_audit_runner -- --test-threads=1
      - name: Read completed DAGs and validate full score reconstruction
        run: |
          node scripts/kiwi-score-trace-prepare.js install-score
          git -C .cache/cc2-wasm-source diff > .cache/cc2-eval-results/score-trace.patch
          RUSTFLAGS="--cfg eval_observer" EVAL_AUDIT_INPUT="$GITHUB_WORKSPACE/docs/audits/cc2-alignment/eval-public-inputs.json" EVAL_AUDIT_OUTPUT="$GITHUB_WORKSPACE/.cache/cc2-eval-results/observed.json" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib eval_audit_runner -- --test-threads=1
          node scripts/kiwi-score-trace-audit.js gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-score-trace
          path: .cache/cc2-eval-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify once, no arena
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/kiwi-score-trace-audit.js notify
