name: CC2 Tetrp combined correctness
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-cc2-combined-audit.yml]
permissions:
  contents: read
concurrency:
  group: cc2-combined-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-transition-source
      - name: Enumerate authority witnesses and supported lifecycle fixtures
        run: |
          node --test test/kiwi-cc2-movegen-audit.test.js test/kiwi-height-domain.test.js test/kiwi-cc2-transition-audit.test.js test/cc2-storage-boundary.test.js
          node scripts/kiwi-cc2-transition-audit.js prepare .cache/cc2-transition-results
          node scripts/kiwi-cc2-trace.js prepare
          node scripts/kiwi-cc2-failed-insert-gate.js .cache/cc2-combined-results prepare
          node scripts/kiwi-cc2-audit-prepare.js .cache/cc2-transition-source .cache/cc2-transition-results failed-insert
          node scripts/kiwi-cc2-movegen-audit.js prepare
          node scripts/kiwi-cc2-reachable-rotation.js .cache/cc2-rotation-results/reference
          cp -r .cache/cc2-rotation-results/reference .cache/cc2-rotation-results/candidate
          node scripts/kiwi-cc2-lifecycle-audit.js prepare
          mkdir -p .cache/cc2-spawn-results
          cp -r .cache/cc2-lifecycle-results .cache/cc2-spawn-results/reference
          cp -r .cache/cc2-lifecycle-results .cache/cc2-spawn-results/candidate
          node scripts/kiwi-cc2-snapshot-hold.js prepare
      - name: Compile full reference and empty-air compression candidate
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cp .cache/cc2-transition-source/Cargo.lock tools/cc2-transition-audit/Cargo.lock
          git -C .cache/cc2-transition-source apply --check "$GITHUB_WORKSPACE/tools/cc2-transition-audit/mid-descent.patch"
          git -C .cache/cc2-transition-source apply "$GITHUB_WORKSPACE/tools/cc2-transition-audit/mid-descent.patch"
          node scripts/kiwi-cc2-rotation-audit.js install .cache/cc2-transition-source
          cargo +1.90.0 build --release --manifest-path tools/cc2-transition-audit/Cargo.toml --features rotation-audit --bin movegen --bin rotation --bin lifecycle
          node scripts/kiwi-cc2-lifecycle-audit.js compare .cache/cc2-spawn-results/reference tools/cc2-transition-audit/target/release/lifecycle
          node scripts/kiwi-cc2-spawn-prepare.js
          node scripts/kiwi-cc2-snapshot-hold.js install .cache/cc2-transition-source
          cargo +1.90.0 build --release --manifest-path tools/cc2-transition-audit/Cargo.toml --features rotation-audit,snapshot-hold-audit --bin movegen --bin rotation --bin lifecycle --bin snapshot_hold
          cargo +1.90.0 test --manifest-path .cache/cc2-transition-source/Cargo.toml --lib spawn_audit_tests
          cargo +1.90.0 test --manifest-path .cache/cc2-transition-source/Cargo.toml --lib snapshot::tests
          node scripts/kiwi-cc2-snapshot-hold.js compare .cache/cc2-snapshot-hold-results tools/cc2-transition-audit/target/release/snapshot_hold
          node scripts/kiwi-cc2-lifecycle-audit.js compare .cache/cc2-spawn-results/candidate tools/cc2-transition-audit/target/release/lifecycle
          node scripts/kiwi-cc2-spawn-gate.js
          cp tools/cc2-transition-audit/Cargo.lock .cache/cc2-movegen-results/Cargo.lock
          rustc +1.90.0 --version > .cache/cc2-movegen-results/rust-version.txt
          node scripts/kiwi-cc2-movegen-audit.js compare .cache/cc2-movegen-results tools/cc2-transition-audit/target/release/movegen
          node scripts/kiwi-cc2-rotation-audit.js compare .cache/cc2-rotation-results/reference tools/cc2-transition-audit/target/release/rotation
          mkdir -p .cache/cc2-air-results
          cp -r .cache/cc2-movegen-results .cache/cc2-air-results/reference
          cp -r .cache/cc2-movegen-results .cache/cc2-air-results/candidate
          cp -r .cache/cc2-movegen-results .cache/cc2-air-results/shared-cache
          node scripts/kiwi-cc2-air-prefix-prepare.js
          RUSTFLAGS="--cfg cc2_air_prefix" cargo +1.90.0 build --release --manifest-path tools/cc2-transition-audit/Cargo.toml --features rotation-audit --bin movegen --bin rotation
          cargo +1.90.0 test --manifest-path .cache/cc2-transition-source/Cargo.toml --lib movegen::
          node scripts/kiwi-cc2-movegen-audit.js compare .cache/cc2-air-results/candidate tools/cc2-transition-audit/target/release/movegen
          CC2_KEEP_AIR_CACHE=1 node scripts/kiwi-cc2-movegen-audit.js compare .cache/cc2-air-results/shared-cache tools/cc2-transition-audit/target/release/movegen
          node scripts/kiwi-cc2-rotation-audit.js compare .cache/cc2-rotation-results/candidate tools/cc2-transition-audit/target/release/rotation
      - name: Verify transaction kernel in the final combined build
        run: |
          RUSTFLAGS="--cfg cc2_air_prefix" cargo +1.90.0 build --release --manifest-path tools/cc2-transition-audit/Cargo.toml --features rotation-audit,snapshot-hold-audit --bin cc2-transition-audit --bin lifecycle --bin snapshot_hold
          node scripts/kiwi-cc2-lifecycle-audit.js compare .cache/cc2-spawn-results/candidate tools/cc2-transition-audit/target/release/lifecycle
          node scripts/kiwi-cc2-spawn-gate.js
          node scripts/kiwi-cc2-snapshot-hold.js compare .cache/cc2-snapshot-hold-results tools/cc2-transition-audit/target/release/snapshot_hold
          export CC2_FAILED_INSERT_REPORT="$GITHUB_WORKSPACE/.cache/cc2-transition-results/failed-insert-boundaries.json"
          RUSTFLAGS="--cfg cc2_air_prefix" cargo +1.90.0 test --manifest-path .cache/cc2-transition-source/Cargo.toml --lib forecast::
          RUSTFLAGS="--cfg cc2_air_prefix" cargo +1.90.0 test --manifest-path .cache/cc2-transition-source/Cargo.toml --lib spawn_audit_tests
          RUSTFLAGS="--cfg cc2_air_prefix" cargo +1.90.0 test --manifest-path .cache/cc2-transition-source/Cargo.toml --lib snapshot::tests
          node scripts/kiwi-cc2-transition-audit.js compare .cache/cc2-transition-results tools/cc2-transition-audit/target/release/cc2-transition-audit
      - name: Require exact placement and cost parity, report cold and warm latency
        run: node scripts/kiwi-cc2-air-prefix-gate.js
      - name: Separate rotation rule differences from cache changes
        run: node scripts/kiwi-cc2-rotation-gate.js
      - name: Require every combined correctness gate
        run: node scripts/kiwi-cc2-combined-gate.js
      - name: Trace accumulated authority state and actual DAG replay
        run: |
          node scripts/kiwi-cc2-trace-prepare.js
          RUSTFLAGS="--cfg cc2_air_prefix" cargo +1.90.0 build --release --manifest-path tools/cc2-transition-audit/Cargo.toml --features trace-audit --bin trace
          node scripts/kiwi-cc2-trace.js compare .cache/cc2-trace-results tools/cc2-transition-audit/target/release/trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc2-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/cc2-transition-results/
            .cache/cc2-combined-results/
            .cache/cc2-trace-results/
            .cache/cc2-air-results/
            .cache/cc2-movegen-results/
            .cache/cc2-rotation-results/
            .cache/cc2-lifecycle-results/
            .cache/cc2-spawn-results/
            .cache/cc2-snapshot-hold-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify completion or failure
        if: always()
        run: node scripts/kiwi-cc2-transition-audit.js notify .cache/cc2-trace-results
