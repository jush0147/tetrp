name: ROOK actual strategic conflict persistence windows
on:
  push:
    branches: [feat/rook-independent-bot]
    paths: [.github/workflows/rook-strategic-persistence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-strategy-window:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [67710, 67711, 67712, 67713]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact public SRS+ / KO protocol first
        run: node --test test/rook-ko-protocol.test.js test/rook-beam.test.js
      # Include meaningful Hold-vs-Place conflicts, not just two nearby drops.
      - name: Select naturally pressured ROOK-vs-Kiwi disagreement, observe 4-32 locks
        env:
          SEED: ${{ matrix.seed }}
          MIN_STRATEGIC_TURN: '8'
          MAX_STRATEGIC_TURN: '28'
          MAX_LOCKS: '64'
          FORK_STRATEGIC_WINDOWS: '1'
          FORK_OPPONENT: kiwi
          ROOK_NODES: '3000'
          KIWI_NODES: '32768'
        run: node scripts/rook-paired-root-fork.js > strategic-window.json
      - name: Validate genuine private authority matching and censoring, not wins
        env:
          EXPECT_SEED: ${{ matrix.seed }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('strategic-window.json','utf8'));
          if(x.independentSeed!==undefined&&x.independentSeed!==
            Number(process.env.EXPECT_SEED))
            throw Error('Incorrect independent game seed');
          if(x.status==='no-eligible-public-conflict'){
            if(x.seed!==Number(process.env.EXPECT_SEED)||
              x.scored!==false)throw Error('Invalid honest no-target result');
            console.log(JSON.stringify({seed:x.seed,
              foundStrategicConflict:false,scored:false,
              reason:x.cause}));
          }else{
            if(x.format!=='rook-authority-paired-root-counterfactual/1'||
              !x.strategicWindow||x.opponentKind!=='kiwi'||
              x.scoredWindowTrial!==false||x.distinctRootActions!==true||
              x.correlatedForksPerOriginalSeed!==2||
              x.results.length!==2||
              x.results.some(r=>r.error||r.windows.length>4)||
              x.pairedWindowComparisons.length!==4||
              x.pairedWindowComparisons.some((p,i)=>
                p.horizon!==[4,8,16,32][i]))
              throw Error('Invalid strategy persistence causal diagnostic');
            console.log(JSON.stringify({seed:x.independentSeed,
              foundStrategicConflict:true,turn:x.forkTurn,
              publicConflict:x.strategicSelection.kind,
              publicPending:x.strategicSelection.originalPublicPending,
              windowChanges:x.pairedWindowComparisons.map(p=>({
                horizon:p.horizon,complete:p.complete,
                boardCellMismatch:p.occupiedCellMismatch??null,
                sentDelta:p.firstMinusSecondCombat?.sent??null,
                tankedDelta:p.firstMinusSecondCombat?.tanked??null,
                exactBoardConvergence:p.identicalCandidateBoard??null
              })),
              disclaimer:'Only observational pressure fork and 4-32-lock outcomes; NO short-window KO win rate'}));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rook-strategic-persistence-${{ matrix.seed }}
          path: strategic-window.json
          retention-days: 30

  across-original-seeds:
    needs: public-strategy-window
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: rook-strategic-persistence-*
          path: paired-diagnostics
          merge-multiple: false
      - name: Analyze per-original-seed mechanism coverage and convergence
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const seeds=[67710,67711,67712,67713];
          const rows=seeds.map(seed=>{
            const r=JSON.parse(readFileSync(
              'paired-diagnostics/rook-strategic-persistence-'+seed+
              '/strategic-window.json','utf8'));
            if((r.independentSeed??r.seed)!==seed||
              r.status==='no-eligible-public-conflict'&&r.scored!==false)
              throw Error('Invalid seeded public match diagnostic '+seed);
            return r;
          });
          const eligible=rows.filter(r=>r.strategicWindow===true);
          const checkpoints=[4,8,16,32].map(horizon=>{
            const obs=eligible.map(r=>r.pairedWindowComparisons.find(x=>
              x.horizon===horizon)).filter(x=>x&&x.complete);
            return {horizon,completedPairedSeeds:obs.length,
              boardActuallyIdentical:obs.filter(x=>
                x.identicalCandidateBoard===true).length,
              exactPublicStateSame:obs.filter(x=>
                x.identicalCandidatePublicState===true).length,
              averageOccupiedCellMismatch:obs.length?
                obs.reduce((n,x)=>n+x.occupiedCellMismatch,0)/obs.length:null,
              sentGapFirstMinusSecond:obs.map(x=>
                x.firstMinusSecondCombat.sent),
              tankedGapFirstMinusSecond:obs.map(x=>
                x.firstMinusSecondCombat.tanked)};
          });
          const report={
            format:'rook-seed-level-strategic-persistence/1',
            originalIndependentSeeds:seeds.length,
            targetedOriginalSeeds:eligible.length,
            noEligibleSeeds:rows.length-eligible.length,
            holdVersusPlace:eligible.filter(x=>
              x.strategicSelection.roots.some(r=>r.kind==='hold')).length,
            checkpoints,scored:false,
            guardrails:'Two treatment forks and four horizons from each seed are correlated observations; no short-window win rate, no private future supplied to bots, and no learned policy yet.'};
          writeFileSync('strategic-summary.json',
            JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rook-strategic-persistence-across-seeds
          path: strategic-summary.json
          retention-days: 30
