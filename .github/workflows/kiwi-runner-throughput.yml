name: Kiwi runner CPU and throughput probe
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-runner-throughput.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-runner-throughput-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact validated native profiles and reference reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36849221714 --repo jush0147/tetrp --name kiwi-native-runtime-36849221714 --dir .cache/native-artifact
          chmod +x .cache/native-artifact/snapshot-accepted .cache/native-artifact/snapshot-visible-t
      - name: Protocol regressions and bounded capacity probe
        run: |
          node --test test/kiwi-native-client.test.js
          node scripts/kiwi-runner-throughput.js bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-runner-throughput-${{ github.run_id }}
          path: .cache/runner-throughput-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify once
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/kiwi-runner-throughput.js notify
