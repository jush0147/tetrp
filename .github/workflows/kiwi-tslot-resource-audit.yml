name: Kiwi visible-T isolated candidate diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-tslot-resource-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-tslot-resource-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIWI_EVAL_FIXTURE: .cache/cc2-eval-results/candidate-inputs.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: jush0147/cold-clear-2
          ref: 2e243242b674d57491f99b445f75e35fc48a0e26
          path: .cache/cc2-wasm-source
      - name: Reconstruct accepted source and public fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36387270053 --repo jush0147/tetrp --name cc2-landing-36387270053-1 --dir .cache/eval-artifact
          git -C .cache/cc2-wasm-source apply --check "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          git -C .cache/cc2-wasm-source apply "$GITHUB_WORKSPACE/.cache/eval-artifact/cc2-wasm-results/landing-final.patch"
          node scripts/kiwi-tslot-candidate-audit.js prepare
          node scripts/kiwi-eval-audit.js baseline .cache/eval-artifact/cc2-wasm-results/pkg
      - name: Install default-off candidate and verify unchanged baseline
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          node scripts/kiwi-eval-observer-prepare.js runner
          node scripts/kiwi-tslot-candidate-prepare.js install
          cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib tslot_resource_tests -- --test-threads=1
          EVAL_AUDIT_INPUT="$GITHUB_WORKSPACE/$KIWI_EVAL_FIXTURE" EVAL_AUDIT_OUTPUT="$GITHUB_WORKSPACE/.cache/cc2-eval-results/native-reference.json" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib eval_audit_runner -- --test-threads=1
      - name: Candidate boundary regression and reports
        env:
          RUSTFLAGS: --cfg snapshot_visible_t
        run: |
          cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib tslot_resource_tests -- --test-threads=1
          cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib snapshot::tests -- --test-threads=1
          EVAL_AUDIT_INPUT="$GITHUB_WORKSPACE/$KIWI_EVAL_FIXTURE" EVAL_AUDIT_OUTPUT="$GITHUB_WORKSPACE/.cache/cc2-eval-results/candidate.json" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib eval_audit_runner -- --test-threads=1
      - name: Check independent resource lineage and observer transparency
        run: |
          node scripts/kiwi-eval-observer-prepare.js instrument
          git -C .cache/cc2-wasm-source diff > .cache/cc2-eval-results/candidate-instrumented.patch
          RUSTFLAGS="--cfg snapshot_visible_t --cfg eval_observer" EVAL_AUDIT_INPUT="$GITHUB_WORKSPACE/$KIWI_EVAL_FIXTURE" EVAL_AUDIT_OUTPUT="$GITHUB_WORKSPACE/.cache/cc2-eval-results/observed.json" cargo +1.90.0 test --locked --release --manifest-path .cache/cc2-wasm-source/Cargo.toml --lib eval_audit_runner -- --test-threads=1
          node scripts/kiwi-tslot-candidate-audit.js gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-tslot-resource-audit-${{ github.run_id }}
          path: .cache/cc2-eval-results/
          include-hidden-files: true
          retention-days: 30
      - name: Notify once
        if: always()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/kiwi-tslot-candidate-audit.js notify
