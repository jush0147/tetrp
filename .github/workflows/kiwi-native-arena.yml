name: Kiwi native arena runtime parity
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-native-arena.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-native-arena-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        leg: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download frozen native and WASM profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36849221714 --repo jush0147/tetrp --name kiwi-native-runtime-36849221714 --dir .cache/native-artifact
          gh run download 36387270053 --repo jush0147/tetrp --name cc2-landing-36387270053-1 --dir .cache/eval-artifact
          gh run download 36702845823 --repo jush0147/tetrp --name kiwi-tslot-wasm-36702845823 --dir .cache/visible-t-artifact
          chmod +x .cache/native-artifact/snapshot-accepted .cache/native-artifact/snapshot-visible-t
      - name: Protocol and authority regression tests
        run: node --test test/kiwi-native-client.test.js test/placement-authority.test.js test/kiwi-cc2-series-score.test.js
      - name: Replay same KO game in both runtimes and compare every report and event
        env:
          NATIVE_ARENA_LEG: ${{ matrix.leg }}
        run: node scripts/kiwi-native-arena.js run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-native-arena-leg-${{ matrix.leg }}
          path: .cache/native-arena-results/
          include-hidden-files: true
          retention-days: 14
  notify:
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: kiwi-native-arena-leg-*
          path: .cache/native-arena-legs
      - name: Notify once
        if: always()
        env:
          ARENA_JOB_STATUS: ${{ needs.integration.result }}
        run: node scripts/kiwi-native-arena.js notify
