name: Kiwi visible-T eight-game KO pilot
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-visible-t-pilot.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kiwi-visible-t-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        leg: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch exact validated candidate and accepted baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36702845823 --repo jush0147/tetrp --name kiwi-tslot-wasm-36702845823 --dir .cache/visible-t-candidate
          gh run download 36387270053 --repo jush0147/tetrp --name cc2-landing-36387270053-1 --dir .cache/visible-t-baseline
      - name: Placement and scoring regression checks
        run: node --test test/placement-authority.test.js test/kiwi-cc2-series-score.test.js test/kiwi-cc2-dense-integration.test.js
      - name: One KO-only paired leg
        timeout-minutes: 120
        env:
          CC2_BATCH_LEG: ${{ matrix.leg }}
        run: node scripts/kiwi-cc2-arena-integration.js .cache/visible-t-candidate .cache/cc2-visible-t-integration-result --batch --visible-t
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc2-visible-t-integration-leg-${{ matrix.leg }}
          path: .cache/cc2-visible-t-integration-result/
          include-hidden-files: true
          compression-level: 9
          retention-days: 7
  summary:
    if: always()
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: cc2-visible-t-integration-leg-*
          path: .cache/cc2-visible-t-integration-downloads
      - name: Validate all legs and notify once
        env:
          BATCH_JOB_STATUS: ${{ needs.game.result }}
        run: node scripts/kiwi-cc2-dense-integration-summary.js --visible-t
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc2-visible-t-integration-summary
          path: .cache/cc2-visible-t-integration-summary.json
          retention-days: 30
