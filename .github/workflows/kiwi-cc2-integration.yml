name: CC2 corrected arena integration
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ft7-actions]
    paths: [.github/workflows/kiwi-cc2-integration.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: cc2-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch the exact browser-tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36323060219 --name cc2-wasm-36323060219-1 --dir .cache/cc2-candidate
      - name: Authority and arena regression checks
        run: node --test test/placement-authority.test.js test/native-arena.test.js
      - name: Two KO-only integration games, shared piece seeds and swapped seats
        timeout-minutes: 240
        run: node scripts/kiwi-cc2-arena-integration.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc2-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/cc2-integration-results/
          include-hidden-files: true
          retention-days: 30
  notify:
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cc2-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/cc2-integration-results
      - name: Notify completion or failure
        env:
          AUDIT_JOB_STATUS: ${{ needs.integration.result }}
        run: node scripts/kiwi-cc2-integration-notify.js
