name: Independent ROOK bot acceptance
on:
  push:
    branches: [feat/rook-independent-bot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independently implemented bot
        run: node --test test/rook.test.js test/rook-session.test.js
      - name: Full Tetrp engine tests
        run: npm test
      - name: Execute independent ROOK against Tetrp authority
        run: node scripts/rook-demo.js 99 8 > rook-run.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: rook-tetrp-player-visible-run
          path: rook-run.jsonl
          retention-days: 30
