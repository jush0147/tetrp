name: Independent ROOK bot acceptance
on:
  push:
    branches: [feat/rook-independent-bot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independently implemented bot
        run: node --test test/rook.test.js test/rook-session.test.js test/rook-atomic.test.js test/rook-tsd.test.js test/rook-spin.test.js test/rook-combat.test.js test/rook-reverse-planner.test.js test/rook-reverse-integration.test.js test/rook-long-planner.test.js test/rook-open-slot.test.js test/rook-pressure.test.js
      - name: Full Tetrp engine tests
        run: npm test
      - name: Execute independent ROOK against Tetrp authority
        run: node scripts/rook-demo.js 99 8 > rook-run.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: rook-tetrp-player-visible-run
          path: rook-run.jsonl
          retention-days: 30
  browser-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build Kiwi and ROOK browser workers
        run: npm run build
      - name: Install Chromium for ROOK-specific browser test
        run: npx playwright install --with-deps chromium
      - name: Verify real ROOK Worker, three placements and unchanged replay
        run: npx playwright test --project=desktop-chromium --grep 'ROOK mode'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetrp-rook-browser-preview
          path: dist/
          if-no-files-found: warn
          retention-days: 30
